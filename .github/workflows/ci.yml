name: Scala CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '25' ]
        scala: [ '2.13', '3.9' ]

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'sbt'
    - uses: sbt/setup-sbt@v1.5.4
    - name: Run tests
      shell: bash
      timeout-minutes: 10
      run: sbt "++${{ matrix.scala }};cleanFull;coverage;test;shutdown"

    - name: Aggregate
      shell: bash
      run: sbt "++${{ matrix.scala }};coverageAggregate;shutdown"

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

